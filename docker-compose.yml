services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      TELEGRAM_LOCAL: "1"
    volumes:
      # Same mount path in both containers so get_file's absolute path resolves.
      - telegram-files:/var/lib/telegram-bot-api
    # ports: ["8081:8081"]   # only needed if you want host access; internal net is enough

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
    env_file: .env
    volumes:
      - ./settings:/app/settings
      - telegram-files:/var/lib/telegram-bot-api
      - workspace:/workspace
    stop_grace_period: 30s

volumes:
  telegram-files:
  workspace:
