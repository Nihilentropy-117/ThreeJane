services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
    command: >
      --local
      --dir=/shared-files
      --http-port=8081
      --api-id=${TELEGRAM_API_ID}
      --api-hash=${TELEGRAM_API_HASH}
    volumes:
      - shared-files:/shared-files
    ports:
      - "8081:8081"
    networks:
      - claude-net
    restart: unless-stopped

  bot:
    build:
      context: ./bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      AUTHORIZED_USER_ID: ${AUTHORIZED_USER_ID}
      BOT_API_URL: ${BOT_API_URL:-http://telegram-bot-api:8081}
      AGENT_URL: ${AGENT_URL:-http://agent:8082}
      CONVERSATIONS_DB_PATH: ${CONVERSATIONS_DB_PATH:-/data/conversations/conversations.db}
    volumes:
      - shared-files:/shared-files
      - conversations:/data/conversations
    depends_on:
      - telegram-bot-api
      - agent
    networks:
      - claude-net
    restart: unless-stopped

  agent:
    build:
      context: ./agent
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AGENT_MODEL: ${AGENT_MODEL:-claude-sonnet-4-20250514}
      AGENT_MAX_TURNS: ${AGENT_MAX_TURNS:-10}
      AGENT_PERMISSION_MODE: ${AGENT_PERMISSION_MODE:-acceptEdits}
      AGENT_ALLOWED_TOOLS: ${AGENT_ALLOWED_TOOLS:-Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Agent}
    volumes:
      - shared-files:/shared-files
      - dot-claude:/home/claude/.claude
      - agent-workspace:/workspace
    networks:
      - claude-net
    restart: unless-stopped

volumes:
  shared-files:
  dot-claude:
  agent-workspace:
  conversations:

networks:
  claude-net:
    driver: bridge
